{% extends "base.html" %}
{% from "_ui.html" import auth_card %}
{% block title %}تغییر رمز عبور - سایت فردوسی حسینی{% endblock %}

{% block content %}
{% call auth_card('تغییر رمز عبور', 'رمز عبور جدید خود را وارد کنید', 'fa-lock') %}
<form method="POST">
    <div class="mb-3">
        <label for="password" class="form-label">رمز عبور جدید</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" autofocus>
        <div class="field-hint">حداقل ۸ کاراکتر</div>
    </div>
    <div class="mb-3">
        <label for="password2" class="form-label">تکرار رمز عبور جدید</label>
        <input type="password" class="form-control" id="password2" name="password2" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary w-100">تغییر رمز عبور</button>
    <div class="auth-links">
        <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-right"></i> بازگشت به صفحه ورود</a>
    </div>
</form>
{% endcall %}
{% endblock %}
